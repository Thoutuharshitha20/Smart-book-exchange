{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="form-wrap"><div class="form-card"><div class="text-center mb-4"><div class="form-icon">🎓</div><h1 class="h3 fw-bold">Create your account</h1><p class="text-secondary">Join your student book-sharing community.</p></div>
<form method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required maxlength="100" placeholder="Your name"></div><div class="mb-3"><label class="form-label">College email</label><input class="form-control" type="email" name="email" required placeholder="you@example.com"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required placeholder="At least 6 characters"></div><button class="btn btn-primary w-100 btn-lg">Register</button></form><p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>{% endblock %}
