{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="form-wrap"><div class="form-card"><div class="text-center mb-4"><div class="form-icon">📚</div><h1 class="h3 fw-bold">Welcome back</h1><p class="text-secondary">Log in to manage your books and requests.</p></div>
<form method="post"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-primary w-100 btn-lg">Log in</button></form><p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
